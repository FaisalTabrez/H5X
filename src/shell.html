<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="color-scheme" content="light dark">
 <title>H5X / {{TITLE}}</title>
 <meta name="description" content="H5X — a growing team from Hyderabad, building, competing and researching together through hackathons, CTFs and bug hunting.">
 <meta name="theme-color" content="#f6f2e9">
 <link rel="icon" href="favicon.ico?v=h5x-logo" sizes="16x16 32x32 48x48">
 <link rel="icon" type="image/png" href="favicon.png?v=h5x-logo" sizes="256x256">
 <link rel="icon" type="image/svg+xml" href="favicon.svg?v=h5x-logo" sizes="any">
 <script>try{const t=localStorage.getItem('h5x-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
 <link rel="stylesheet" href="css/site.css">
 <link rel="stylesheet" href="css/popups.css">
</head>
<body data-page="{{PAGE}}">
 <a class="skip" href="#content">Skip to content</a>
 <header class="header">
  <a class="brand" href="index.html" aria-label="H5X home">H5X<span> /</span></a>
  <nav class="nav mono" aria-label="Main pages">{{NAV}}</nav>
  <div class="appearance mono" aria-label="Appearance"><button type="button" data-set="light" aria-pressed="false">light</button><span>·</span><button type="button" data-set="dark" aria-pressed="false">dark</button></div>
 </header>
 <main id="content" class="workspace workspace-{{PAGE}}">{{CONTENT}}</main>
 <footer class="footer mono"><span>H5X · HYDERABAD</span><div class="footer-center"><a href="https://ctftime.org/team/438630" target="_blank" rel="noopener noreferrer">CTFtime ↗</a><button type="button" id="snd" aria-pressed="false">sound off</button><button type="button" id="motion" aria-pressed="false" hidden>pause motion</button></div><time id="clock"></time></footer>

 <script id="h5x-feed-config" type="application/json">{{FEED_CONFIG}}</script>
 <script src="js/sound.js"></script><script src="js/app.js"></script><script src="js/ctftime.js"></script><script src="js/popups.js"></script><script src="js/logo-mask.js"></script><script src="js/mark.js"></script>
</body>
