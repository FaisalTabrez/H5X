apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: h5x-devops-lab
  name: h5x-devops
---
apiVersion: v1
kind: Service
metadata:
  name: h5x
  namespace: h5x-devops
spec:
  ports:
  - name: http
    nodePort: 30080
    port: 80
    targetPort: http
  selector:
    app: h5x
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: h5x
  namespace: h5x-devops
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: h5x
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: h5x
    spec:
      automountServiceAccountToken: false
      containers:
      - image: h5x-devops:build-2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        name: website
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
      volumes:
      - emptyDir: {}
        name: tmp
