server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
    location = /ctftime.json {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
